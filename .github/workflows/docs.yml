name: docs

# 문서 수정 PR 의 안전망 — 허브의 앵커 경고는 제안 화면에서만 돕는다.
# CLI·GitHub 웹 편집으로 들어온 수정도 여기서 깨진 문서 링크와 프론트매터 깨짐(빌드 실패)을 잡는다.
on: pull_request

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:anchors
      - run: npm run build
